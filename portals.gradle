// Each entry produces its own launcher app and private WebView session.
// All apps may follow links among these approved BWA sites and sign-in hosts.
def navigationHosts = [
    'rhib-control.blw.ai',
    'rhib.blw.ai',
    'dreadnought.blw.ai',
    'rhib-grafana.blw.ai', // Observed destination in the RHIB sign-in flow.
    'bluewater-ai.cloudflareaccess.com',
    'login.microsoftonline.com',
    'login.microsoft.com',
    'login.live.com'
]

ext.portals = [
