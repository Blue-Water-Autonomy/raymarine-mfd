        url: 'https://rhib-control.blw.ai/',
        hosts: navigationHosts
    ],
    rhib: [
        applicationId: 'ai.blw.mfd.rhib',
        name: 'RHIB',
        url: 'https://rhib.blw.ai/',
        hosts: navigationHosts
    ],
    dreadnought: [
        applicationId: 'ai.blw.mfd.dreadnought',
        name: 'Dreadnought',
        url: 'https://dreadnought.blw.ai/',
        hosts: navigationHosts
    ]
]
