name: Android APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test, lint, and build
        run: ./gradlew :app:verifyPortals --no-daemon -PciBuildNumber="$GITHUB_RUN_NUMBER"
      - name: Package versioned release assets
        run: python3 scripts/release.py package
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.run_id }}
          if-no-files-found: error
          path: dist/release/
          overwrite: true
      - name: Upload unsigned release APKs
        uses: actions/upload-artifact@v4
        with:
          name: raymarine-mfd-unsigned-${{ github.sha }}
          if-no-files-found: error
          overwrite: true
          path: app/build/outputs/apk/*/release/*.apk
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: raymarine-mfd-debug-${{ github.sha }}
          if-no-files-found: error
          overwrite: true
          path: app/build/outputs/apk/*/debug/*.apk
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raymarine-mfd-reports-${{ github.sha }}
          overwrite: true
          path: app/build/reports/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.run_id }}
          path: dist/release/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py publish
